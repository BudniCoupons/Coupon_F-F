<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gutschein</title>
<style>
  html, body { margin: 0; padding: 0; background: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 0 0 24px; }
  img { display: block; width: 100%; height: auto; -webkit-touch-callout: default; }
  .actions { padding: 16px 16px 0; }
  button, a.btn {
    display: block; width: 100%; box-sizing: border-box; text-align: center;
    padding: 16px; font-size: 18px; font-weight: 600; color: #fff; background: #123c8f;
    border: 0; border-radius: 12px; text-decoration: none; cursor: pointer;
  }
  button:active, a.btn:active { opacity: .85; }
  .notice { margin: 0; padding: 14px 16px; background: #fff4e5; border-bottom: 2px solid #f0a030; color: #5a3a00; font-size: 15px; line-height: 1.4; text-align: center; }
  #hint { margin: 12px 4px 0; font-size: 14px; line-height: 1.4; color: #444; text-align: center; min-height: 1.4em; }
</style>
</head>
<body>
<div class="wrap">
  <p class="notice"><strong>Hinweis:</strong> Diese Aktion gilt nur für Mitarbeitende sowie deren Freunde und Verwandte.</p>
  <img id="coupon" src="coupon.png" alt="Gutschein: 10 % Rabatt, gültig bis 05.12.2026">
  <div class="actions">
    <button id="save" type="button">Bild speichern</button>
    <p id="hint">Auf dem iPhone: im Menü „Bild sichern“ wählen. Alternativ das Bild lange gedrückt halten.</p>
  </div>
</div>
<script>
(function () {
  var btn = document.getElementById('save');
  var hint = document.getElementById('hint');
  var FILE = 'coupon.png';

  function fallbackDownload(blob) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = FILE;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    hint.textContent = 'Download gestartet. Wird nichts gespeichert, halte das Bild lange gedrückt und wähle „Bild speichern“.';
  }

  btn.addEventListener('click', function () {
    fetch(FILE)
      .then(function (r) { return r.blob(); })
      .then(function (blob) {
        var file = new File([blob], FILE, { type: 'image/png' });
        // Smartphones: Teilen-Menü enthält "Bild sichern" (iOS) bzw. Speichern (Android)
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          return navigator.share({ files: [file] }).catch(function (e) {
            if (e && e.name === 'AbortError') return; // vom Nutzer abgebrochen
            fallbackDownload(blob);
          });
        }
        fallbackDownload(blob);
      })
      .catch(function () {
        hint.textContent = 'Speichern hat nicht geklappt. Halte das Bild lange gedrückt und wähle „Bild speichern“.';
      });
  });
})();
</script>
</body>
</html>
